  <g fill="#FFFFFF">
    <rect x="6.4"   y="8.32"  width="2.72" height="15.36"/>
    <rect x="6.4"   y="8.32"  width="5.12" height="2.72"/>
    <rect x="6.4"   y="20.96" width="5.12" height="2.72"/>
    <rect x="22.88" y="8.32"  width="2.72" height="15.36"/>
    <rect x="20.48" y="8.32"  width="5.12" height="2.72"/>
    <rect x="20.48" y="20.96" width="5.12" height="2.72"/>
  </g>
</svg>
