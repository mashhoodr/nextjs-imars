# Checks that every homepage section is present and has content
# (scripts/check-sections.mjs) after each production deployment. A failure
# emails the repo owner. ISR regenerations are guarded by lib/section-checks.js.
name: Check homepage sections

on:
  deployment_status:
  workflow_dispatch:

jobs:
  check:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Production deployment URLs can sit behind Vercel's deployment protection,
      # so the check reads the public domain the deployment was just aliased to.
      - run: node scripts/check-sections.mjs https://karachiwala.dev
